# PR 打开或更新时，在 PR 评论中回链标题/描述/分支名里的 Jira 工作项。
# 使用 pull_request_target：以基仓 GITHUB_TOKEN 写评论，不 checkout PR 代码，
# 不读取 fork PR 的 secrets。
name: jira-link

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Link Jira issues
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- omr-jira-link -->';
            const JIRA_BROWSE = 'https://bamboolab.atlassian.net/browse';
            const pr = context.payload.pull_request;
            const text = [pr.title, pr.body || '', pr.head.ref].join('\n');
            const keys = [...new Set(
              (text.match(/OMR-\d+/gi) || []).map((key) => key.toUpperCase())
            )].sort();

            let body;
            if (keys.length === 0) {
              body = [
                MARKER,
                '未在 PR 标题、描述或分支名中找到 Jira 工作项（OMR-xxx）。',
                '请补充后再合并；格式见 `docs/process/git_collaboration_spec.md`。',
              ].join('\n');
            } else {
              body = [
                MARKER,
                '关联 Jira 工作项：',
                ...keys.map((key) => `- [${key}](${JIRA_BROWSE}/${key})`),
              ].join('\n');
            }

            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(MARKER)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            if (keys.length === 0) {
              core.setFailed('PR does not reference a Jira issue (OMR-xxx)');
            }
